
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pars Coin</title>

  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f3f5;
      padding: 20px;
    }
    main {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 22px;
      border-radius: 15px;
    }
    code {
      display: block;
      direction: ltr;
      overflow-wrap: anywhere;
      background: #eee;
      padding: 10px;
      border-radius: 7px;
    }
    #status {
      margin-top: 20px;
      line-height: 1.8;
    }
  </style>
</head>

<body>
<main>
  <h2>Pars Coin - PS</h2>

  <p>قرارداد توکن:</p>
  <code>EQAI8QPV1fyFuUcWqXgdCRCIMzB5V_nRyVDemXzhomx_ivki</code>

  <p>کیف پول مدیر مورد انتظار:</p>
  <code>UQCencFjTVcZcqaSIpOMvLX2dckuF5pbUkzUckXvrmaSkXIp</code>

  <div id="wallet"></div>

  <p id="status">لطفاً کیف پول مدیر را متصل کن.</p>

  <p>
    این صفحه در حال حاضر فقط اتصال کیف پول را بررسی می‌کند
    و هیچ تراکنشی ارسال نمی‌کند.
  </p>
</main>

<script>
const ADMIN =
  "UQCencFjTVcZcqaSIpOMvLX2dckuF5pbUkzUckXvrmaSkXIp";

const statusBox = document.getElementById("status");

const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
  manifestUrl:
    "https://ruhollahhaghshenas-glitch.github.io/Parscoin-/tonconnect-manifest.json",
  buttonRootId: "wallet"
});

function normalizeAddress(address) {
  return TON_CONNECT_UI.toUserFriendlyAddress(
    address,
    false,
    false
  );
}

tonConnectUI.onStatusChange(wallet => {
  if (!wallet) {
    statusBox.textContent = "کیف پول متصل نیست.";
    return;
  }

  try {
    const connectedAddress =
      normalizeAddress(wallet.account.address);

    const adminAddress =
      normalizeAddress(ADMIN);

    if (
      connectedAddress.toLowerCase() ===
      adminAddress.toLowerCase()
    ) {
      statusBox.textContent =
        "کیف پول مدیر با موفقیت شناسایی شد. هنوز هیچ تراکنشی ارسال نشده است.";
    } else {
      statusBox.textContent =
        "این کیف پول، کیف پول مدیر قرارداد نیست. تراکنشی ارسال نمی‌شود.";
    }
  } catch (error) {
    statusBox.textContent =
      "خطا در بررسی آدرس کیف پول.";
  }
});
</script>
</body>
</html>

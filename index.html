
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pars Coin - PS</title>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<style>
body{font-family:Arial;background:#f1f3f5;padding:20px;margin:0}
main{max-width:500px;margin:30px auto;padding:24px;background:white;border-radius:16px}
h2{text-align:center;color:#1769aa}
p{line-height:1.8}
code{display:block;direction:ltr;overflow-wrap:anywhere;background:#eee;padding:12px;border-radius:8px;font-size:12px}
#wallet{margin-top:20px}
#status{margin-top:20px;padding:12px;background:#f1f3f5;border-radius:8px;line-height:1.8}
</style>
</head>
<body>
<main>
<h2>Pars Coin - PS</h2>
<p>قرارداد اصلی توکن:</p>
<code>EQAI8QPV1fyFuUcWqXgdCRCIMzB5V_nRyVDemXzhomx_ivki</code>
<p>آدرس کیف پول مدیر:</p>
<code>UQCencFjTVcZcqaSIpOMvLX2dckuF5pbUkzUckXvrmaSkXIp</code>
<div id="wallet"></div>
<p id="status">لطفاً کیف پول خود را متصل کنید.</p>
<p>این صفحه فقط اتصال کیف پول و آدرس مدیر را بررسی می‌کند. هیچ تراکنشی ارسال نمی‌شود.</p>
</main>

<script>
(function(){
const ADMIN_RAW="0:9e9dc1634d571972a69222938cbcb5f675c92e179a5b524cd47245efae669291";
const MANIFEST="https://ruhollahhaghshenas-glitch.github.io/Parscoin-/tonconnect-manifest.json";
const statusBox=document.getElementById("status");

if(!window.TON_CONNECT_UI){
statusBox.textContent="کتابخانه اتصال بارگذاری نشد. صفحه را دوباره باز کنید.";
return;
}

const tonConnectUI=new TON_CONNECT_UI.TonConnectUI({
manifestUrl:MANIFEST,
buttonRootId:"wallet"
});

function rawAddress(address){
const parts=address.split(":");
if(parts.length!==2) throw new Error("فرمت آدرس نامعتبر است.");
return parts[0].toLowerCase()+":"+parts[1].toLowerCase();
}

tonConnectUI.onStatusChange(function(wallet){
if(!wallet||!wallet.account){
statusBox.textContent="کیف پول متصل نیست.";
return;
}
try{
const connected=rawAddress(wallet.account.address);
const admin=rawAddress(ADMIN_RAW);
if(connected===admin){
statusBox.textContent="کیف پول مدیر شناسایی شد. هیچ تراکنشی ارسال نشده است.";
}else{
statusBox.textContent="کیف پول متصل شد، اما مدیر قرارداد نیست. هیچ تراکنشی ارسال نشده است.";
}
}catch(error){
statusBox.textContent="خطا در بررسی آدرس کیف پول: "+error.message;
}
});
})();
</script>
</body>
</html>
